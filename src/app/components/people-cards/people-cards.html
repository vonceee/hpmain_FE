<section class="section-wrapper">
  <title-badge title="Meet our Specialist"></title-badge>
  <br><br>

<container-box>
        <section class="grid-container">
      @for (card of cards; track card.title) {
      <div class="cell">
        <div class="icon-wrapper">
          <img [src]="card.img">
        </div>
        <p class="cell-title">{{ card.title }}</p>
        <p class="cell-desc">{{ card.desc }}</p>
      </div>
      }
    </section>
  </container-box>
</section>

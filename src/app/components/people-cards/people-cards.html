<section class="section-wrapper">
  <title-badge title="Meet our Specialist"></title-badge>
  <br><br>

<container-box>
        <section class="grid-3x2">
      @for (card of cards; track card.title) {
      <div class="cell">
        <div class="icon-wrapper">
          <i [class]="card.icon"></i>
        </div>
        <p class="cell-title">{{ card.title }}</p>
        <p class="cell-desc">{{ card.desc }}</p>
      </div>
      }
    </section>
  </container-box>
</section>
